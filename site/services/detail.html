<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketia China | Services</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Marketia China — Air & Sea Freight, Factory Sourcing, Customs & LC Support, Custom Product Sourcing, and Wholesale Solutions between China and Bangladesh." />
  <meta name="author" content="Marketia China Ltd." />

  <!-- Google Fonts: Hind Siliguri (Bengali), Noto Sans SC (Chinese), Plus Jakarta Sans (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (locally built, no CDN dependency at runtime) -->
  <link rel="stylesheet" href="/css/tailwind.build.css" />

  <!-- Marketia China Design System Stylesheets -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/glass.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body class="font-bengali">

  <div class="service-page">

    <!-- Minimal top bar: just the logo linking back home -->
    <header class="service-topbar">
      <div class="service-topbar-inner">
        <a href="/" class="auth-logo-link" aria-label="Marketia China Home">
          <span class="auth-logo-mark">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L4.5 9.5l1.4 1.4L11 5.8V20h2V5.8l5.1 5.1 1.4-1.4L12 2z" opacity="0.3"/>
              <path d="M12 4L5 11h4v9h6v-9h4L12 4z"/>
            </svg>
          </span>
          <span class="auth-logo-text-wrap">
            <span class="auth-logo-text">MARKETIA <em>CHINA</em></span>
            <span class="auth-logo-sub">China → Bangladesh</span>
          </span>
        </a>
      </div>
    </header>

    <!-- Populated by ServiceDetailPage.js based on the URL slug -->
    <main id="page-root" class="service-main"></main>

    <!-- Reuses the site's existing Footer component -->
    <footer id="footer-root"></footer>

  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="/js/pages/ServiceDetailPage.js"></script>

</html>
