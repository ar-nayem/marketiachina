<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | Marketia China Control Panel</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/admin/css/admin.css" />

<style>
  .admin-dashboard-panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 980px) {
    .admin-dashboard-panels {
      grid-template-columns: 1fr;
    }
  }

  .admin-panel-link {
    font-size: 12px;
    font-weight: 700;
    color: var(--mc-china-red);
  }

  .admin-table tr.clickable-row {
    cursor: pointer;
  }

  .admin-topbar-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .admin-revenue-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 16px;
  }

  .admin-revenue-row .admin-stat-tile .value {
    font-size: 20px;
  }

  .admin-status-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .admin-status-pills .admin-badge {
    font-size: 13px;
  }

  .admin-chart-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .admin-chart-axis {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .admin-mini-panels {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 980px) {
    .admin-mini-panels {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
  import {
    apiFetch,
    requireAdminAuth,
    renderSidebar,
    wireLogout,
    escapeHtml,
    formatDate
  } from '/admin/js/adminShell.js';

  const admin = await requireAdminAuth();
  if (!admin) {
    // requireAdminAuth already redirected to the login page.
    throw new Error('not authenticated');
  }

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="admin-shell">
      ${renderSidebar('dashboard', admin)}
      <div class="admin-main">
        <header class="admin-topbar">
          <div>
            <h1>Dashboard</h1>
            <div class="admin-topbar-sub">Welcome back, ${escapeHtml(admin.name)}</div>
          </div>
        </header>
        <main class="admin-content">
          <div class="admin-stat-grid" id="admin-stat-grid">
            ${renderStatTile('—', 'Orders')}
            ${renderStatTile('—', 'Revenue (last 30d)')}
            ${renderStatTile('—', 'New Leads (7d)')}
            ${renderStatTile('—', 'New Messages (7d)')}
            ${renderStatTile('—', 'Active Products')}
          </div>

          <section class="admin-panel">
            <div class="admin-panel-header">
              <h2>Revenue Breakdown</h2>
            </div>
            <div class="admin-revenue-row" id="admin-revenue-row">
              ${renderStatTile('—', 'Today')}
              ${renderStatTile('—', 'Yesterday')}
              ${renderStatTile('—', 'This Week')}
              ${renderStatTile('—', 'This Month')}
              ${renderStatTile('—', 'This Year')}
            </div>
          </section>

          <section class="admin-panel">
            <div class="admin-panel-header">
              <h2>Revenue - Last 30 Days</h2>
            </div>
            <div class="admin-chart-wrap" id="admin-revenue-chart">
              <div class="admin-table-empty">Loading…</div>
            </div>
          </section>

          <div class="admin-mini-panels">
            <section class="admin-panel">
              <div class="admin-panel-header">
                <h2>Orders by Status</h2>
              </div>
              <div class="admin-status-pills" id="admin-orders-by-status">
                <span class="admin-table-empty">Loading…</span>
              </div>
            </section>

            <section class="admin-panel">
              <div class="admin-panel-header">
                <h2>Products by Status</h2>
              </div>
              <div class="admin-status-pills" id="admin-products-by-status">
                <span class="admin-table-empty">Loading…</span>
              </div>
            </section>

            <section class="admin-panel">
              <div class="admin-panel-header">
                <h2>Customers</h2>
              </div>
              <div class="admin-revenue-row" id="admin-customers-row">
                ${renderStatTile('—', 'Total Customers')}
                ${renderStatTile('—', 'New This Week')}
              </div>
            </section>
          </div>

          <div class="admin-dashboard-panels">
            <section class="admin-panel">
              <div class="admin-panel-header">
                <h2>Recent Orders</h2>
                <a href="/admin/orders.html" class="admin-panel-link">View all</a>
              </div>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Order #</th>
                      <th>Customer</th>
                      <th>Total</th>
                      <th>Status</th>
                      <th>Date</th>
                    </tr>
                  </thead>
                  <tbody id="admin-recent-orders">
                    <tr><td colspan="5" class="admin-table-empty">Loading…</td></tr>
                  </tbody>
                </table>
              </div>
            </section>

            <section class="admin-panel">
              <div class="admin-panel-header">
                <h2>Recent Messages</h2>
                <a href="/admin/messages.html" class="admin-panel-link">View all</a>
              </div>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Subject</th>
                      <th>Status</th>
                      <th>Date</th>
                    </tr>
                  </thead>
                  <tbody id="admin-recent-messages">
                    <tr><td colspan="4" class="admin-table-empty">Loading…</td></tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  `;

  wireLogout();

  function renderStatTile(value, label) {
    return `
      <div class="admin-stat-tile">
        <div class="value">${value}</div>
        <div class="label">${label}</div>
      </div>
    `;
  }

  function statusBadgeClass(status) {
    const s = String(status || '').toLowerCase();
    if (['delivered', 'confirmed', 'replied', 'active'].includes(s)) return 'admin-badge-green';
    if (['shipped', 'read'].includes(s)) return 'admin-badge-gold';
    if (['cancelled', 'closed'].includes(s)) return 'admin-badge-red';
    return 'admin-badge-neutral';
  }

  // pull a field off a row trying both camelCase and snake_case keys
  function field(row, camel, snake) {
    if (row[camel] !== undefined && row[camel] !== null) return row[camel];
    if (snake && row[snake] !== undefined && row[snake] !== null) return row[snake];
    return null;
  }

  function renderBdt(value) {
    return '৳' + Number(value || 0).toLocaleString();
  }

  function renderStatusPills(counts, labels) {
    return Object.keys(labels).map((key) => {
      const count = Number(counts[key] || 0);
      return `<span class="admin-badge ${statusBadgeClass(key)}">${escapeHtml(labels[key])}: ${count.toLocaleString()}</span>`;
    }).join('');
  }

  function shortDate(iso) {
    // 'YYYY-MM-DD' -> e.g. "17 Jul", using the same UTC date parts as the API.
    const [y, m, d] = String(iso || '').split('-').map(Number);
    if (!y || !m || !d) return iso || '';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${months[m - 1]}`;
  }

  function renderRevenueChart(trend) {
    const days = trend || [];
    const maxRevenue = Math.max(...days.map(t => t.revenue), 1);
    const bars = days.map((day, index) => {
      const barHeight = (day.revenue / maxRevenue) * 70;
      const x = index * 10;
      const y = 80 - barHeight;
      return `<rect x="${x}" y="${y}" width="8" height="${barHeight}" fill="#DE2910"><title>${escapeHtml(day.date)}: ৳${Number(day.revenue || 0).toLocaleString()}</title></rect>`;
    }).join('');
    const firstLabel = days.length ? shortDate(days[0].date) : '';
    const lastLabel = days.length ? shortDate(days[days.length - 1].date) : '';
    return `
      <svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">${bars}</svg>
      <div class="admin-chart-axis">
        <span>${escapeHtml(firstLabel)}</span>
        <span>${escapeHtml(lastLabel)}</span>
      </div>
    `;
  }

  async function loadStats() {
    try {
      const data = await apiFetch('/api/admin/stats');
      const grid = document.getElementById('admin-stat-grid');
      const revenue = Number(data.revenueBdt30d || 0);
      grid.innerHTML = [
        renderStatTile(Number(data.ordersCount || 0).toLocaleString(), 'Orders'),
        renderStatTile('৳' + revenue.toLocaleString(), 'Revenue (last 30d)'),
        renderStatTile(Number(data.newLeads7d || 0).toLocaleString(), 'New Leads (7d)'),
        renderStatTile(Number(data.newMessages7d || 0).toLocaleString(), 'New Messages (7d)'),
        renderStatTile(Number(data.productCount || 0).toLocaleString(), 'Active Products')
      ].join('');

      const rev = data.revenue || {};
      document.getElementById('admin-revenue-row').innerHTML = [
        renderStatTile(renderBdt(rev.today), 'Today'),
        renderStatTile(renderBdt(rev.yesterday), 'Yesterday'),
        renderStatTile(renderBdt(rev.thisWeek), 'This Week'),
        renderStatTile(renderBdt(rev.thisMonth), 'This Month'),
        renderStatTile(renderBdt(rev.thisYear), 'This Year')
      ].join('');

      document.getElementById('admin-orders-by-status').innerHTML = renderStatusPills(
        data.ordersByStatus || {},
        { pending: 'Pending', confirmed: 'Confirmed', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' }
      );

      document.getElementById('admin-products-by-status').innerHTML = renderStatusPills(
        data.productsByStatus || {},
        { published: 'Published', draft: 'Draft', archived: 'Archived' }
      );

      const customers = data.customers || {};
      document.getElementById('admin-customers-row').innerHTML = [
        renderStatTile(Number(customers.total || 0).toLocaleString(), 'Total Customers'),
        renderStatTile(Number(customers.newThisWeek || 0).toLocaleString(), 'New This Week')
      ].join('');

      document.getElementById('admin-revenue-chart').innerHTML = renderRevenueChart(data.revenueTrend30d || []);
    } catch (err) {
      document.getElementById('admin-stat-grid').innerHTML =
        `<div class="admin-table-empty">Could not load stats: ${escapeHtml(err.message)}</div>`;
    }
  }

  async function loadRecentOrders() {
    const tbody = document.getElementById('admin-recent-orders');
    try {
      const data = await apiFetch('/api/admin/orders');
      const orders = (data.orders || []).slice(0, 5);
      if (!orders.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="admin-table-empty">No orders yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = orders.map(o => `
        <tr class="clickable-row" onclick="window.location.href='/admin/orders.html'">
          <td>${escapeHtml(field(o, 'orderNumber', 'order_number'))}</td>
          <td>${escapeHtml(field(o, 'customerName', 'customer_name'))}</td>
          <td>৳${Number(field(o, 'totalBdt', 'total_bdt') || 0).toLocaleString()}</td>
          <td><span class="admin-badge ${statusBadgeClass(o.status)}">${escapeHtml(o.status)}</span></td>
          <td>${formatDate(field(o, 'createdAt', 'created_at'))}</td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="admin-table-empty">Could not load orders: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  async function loadRecentMessages() {
    const tbody = document.getElementById('admin-recent-messages');
    try {
      const data = await apiFetch('/api/admin/messages');
      const messages = (data.messages || []).slice(0, 5);
      if (!messages.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="admin-table-empty">No messages yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = messages.map(m => `
        <tr class="clickable-row" onclick="window.location.href='/admin/messages.html'">
          <td>${escapeHtml(field(m, 'name'))}</td>
          <td>${escapeHtml(field(m, 'subject') || '—')}</td>
          <td><span class="admin-badge ${statusBadgeClass(m.status)}">${escapeHtml(m.status || 'new')}</span></td>
          <td>${formatDate(field(m, 'createdAt', 'created_at'))}</td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" class="admin-table-empty">Could not load messages: ${escapeHtml(err.message)}</td></tr>`;
    }
  }

  loadStats();
  loadRecentOrders();
  loadRecentMessages();
</script>

</body>
</html>
