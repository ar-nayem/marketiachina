<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Marketia China Admin</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Tailwind CSS (locally built, no CDN dependency at runtime) -->
  <link rel="stylesheet" href="../css/tailwind.build.css" />

  <!-- Marketia China Design System Stylesheets -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/glass.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Admin control panel layout -->
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="admin-root"></div>

  <script type="module">
    import {
      apiFetch,
      requireAdminAuth,
      renderSidebar,
      wireLogout,
      escapeHtml,
      formatDate
    } from '/admin/js/adminShell.js';

    const RATE_FIELDS = [
      { key: 'usdToBdt', label: 'USD → BDT rate', step: '0.01' },
      { key: 'cnyToBdt', label: 'CNY → BDT rate', step: '0.01' },
      { key: 'airBdtPerKg', label: 'Air freight (BDT/kg)', step: '1' },
      { key: 'seaBdtPerKg', label: 'Sea freight (BDT/kg)', step: '1' },
      { key: 'cartAirFactor', label: 'Cart air multiplier', step: '0.01' },
      { key: 'cartSeaFactor', label: 'Cart sea multiplier', step: '0.01' },
      { key: 'portFeeBdt', label: 'Port fee (BDT)', step: '1' }
    ];

    let dutyRowCount = 0;

    function dutyRowHtml(label, ratePercent) {
      const idx = dutyRowCount++;
      return `
        <tr data-duty-row="${idx}">
          <td><input class="form-input" type="text" data-duty-label value="${escapeHtml(label ?? '')}" placeholder="Category name" /></td>
          <td style="display:flex;align-items:center;gap:8px;">
            <input class="form-input" type="number" step="0.1" data-duty-rate value="${escapeHtml(String(ratePercent ?? ''))}" style="max-width:110px;" />
            <span style="color:var(--text-muted);">%</span>
            <button type="button" class="btn-icon" data-remove-duty title="Remove">✕</button>
          </td>
        </tr>
      `;
    }

    function renderShippingRates(rates) {
      const wrap = document.getElementById('shipping-rates-display');
      const r = rates || {};

      const fields = RATE_FIELDS.map(
        (f) => `
        <div>
          <label class="form-label" for="rate-${f.key}">${escapeHtml(f.label)}</label>
          <input class="form-input" type="number" step="${f.step}" id="rate-${f.key}" value="${escapeHtml(r[f.key] ?? '')}" />
        </div>
      `
      ).join('');

      const duties = Array.isArray(r.dutyCategories) ? r.dutyCategories : [];
      dutyRowCount = 0;
      const dutyRows = duties.length
        ? duties.map((d) => dutyRowHtml(d.label, d.rate !== undefined && d.rate !== null ? Number(d.rate) * 100 : '')).join('')
        : '';

      wrap.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;padding:20px;">
          ${fields}
        </div>
        <div style="padding:0 20px 20px 20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);">Duty Categories</div>
            <button type="button" class="btn-secondary" id="add-duty-row" style="padding:4px 12px;font-size:13px;">+ Add Category</button>
          </div>
          <div class="admin-table-wrap" style="border:1px solid var(--border-color);border-radius:var(--radius-sm);">
            <table class="admin-table">
              <thead><tr><th>Category</th><th>Duty Rate</th></tr></thead>
              <tbody id="duty-rows-body">${dutyRows}</tbody>
            </table>
          </div>
        </div>
        <div style="padding:0 20px 20px 20px;display:flex;align-items:center;gap:14px;">
          <button type="button" class="btn-primary" id="save-rates-btn">Save Shipping Rates</button>
          <span id="rates-save-status" style="font-size:13px;color:var(--text-muted);"></span>
        </div>
      `;

      document.getElementById('add-duty-row').addEventListener('click', () => {
        document.getElementById('duty-rows-body').insertAdjacentHTML('beforeend', dutyRowHtml('', ''));
      });
      wrap.addEventListener('click', (evt) => {
        if (evt.target.matches('[data-remove-duty]')) {
          evt.target.closest('tr').remove();
        }
      });
      document.getElementById('save-rates-btn').addEventListener('click', handleSaveRates);
    }

    function readShippingRatesForm() {
      const rates = {};
      for (const f of RATE_FIELDS) {
        const val = document.getElementById(`rate-${f.key}`).value;
        rates[f.key] = val === '' ? null : Number(val);
      }
      rates.dutyCategories = Array.from(document.querySelectorAll('#duty-rows-body tr'))
        .map((row) => {
          const label = row.querySelector('[data-duty-label]').value.trim();
          const ratePercent = row.querySelector('[data-duty-rate]').value;
          if (!label || ratePercent === '') return null;
          return { label, rate: Number(ratePercent) / 100 };
        })
        .filter(Boolean);
      return rates;
    }

    async function handleSaveRates() {
      const btn = document.getElementById('save-rates-btn');
      const status = document.getElementById('rates-save-status');
      const shippingRates = readShippingRatesForm();

      btn.disabled = true;
      status.style.color = 'var(--text-muted)';
      status.textContent = 'Saving…';
      try {
        await apiFetch('/api/admin/settings', {
          method: 'PUT',
          body: JSON.stringify({ shippingRates })
        });
        status.textContent = 'Saved.';
      } catch (err) {
        status.style.color = 'var(--mc-china-red)';
        status.textContent = `Failed to save: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(message, isError) {
      const el = document.getElementById('settings-save-status');
      el.textContent = message;
      el.style.color = isError ? 'var(--mc-china-red)' : 'var(--text-muted)';
    }

    function setSecurityStatus(elId, message, isError) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = message;
      el.style.color = isError ? 'var(--mc-china-red)' : 'var(--text-muted)';
    }

    async function handleChangePassword(evt) {
      evt.preventDefault();
      const btn = document.getElementById('change-password-btn');
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        setSecurityStatus('change-password-status', 'New password must be at least 8 characters.', true);
        return;
      }
      if (newPassword !== confirmPassword) {
        setSecurityStatus('change-password-status', 'New passwords do not match.', true);
        return;
      }

      btn.disabled = true;
      setSecurityStatus('change-password-status', 'Saving…', false);
      try {
        await apiFetch('/api/admin/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ currentPassword, newPassword })
        });
        setSecurityStatus('change-password-status', 'Password changed.', false);
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (err) {
        setSecurityStatus('change-password-status', `Failed to change password: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    function sessionRowHtml(s) {
      const device = s.userAgent || 'Unknown device';
      const badgeOrBtn = s.isCurrent
        ? `<span class="admin-badge admin-badge-green">This device</span>`
        : `<button type="button" class="btn-secondary revoke-session-btn" data-id="${s.id}" style="padding:6px 12px;font-size:12px;">Revoke</button>`;

      return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border-color);">
          <div>
            <div style="font-size:13px;font-weight:600;">${escapeHtml(device)}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Signed in ${escapeHtml(formatDate(s.createdAt))}</div>
          </div>
          <div>${badgeOrBtn}</div>
        </div>
      `;
    }

    async function loadSessions() {
      const wrap = document.getElementById('sessions-list');
      try {
        const data = await apiFetch('/api/admin/auth/sessions');
        const sessions = data.sessions || [];
        wrap.innerHTML = sessions.length
          ? sessions.map(sessionRowHtml).join('')
          : `<div class="admin-table-empty">No active sessions.</div>`;

        wrap.querySelectorAll('.revoke-session-btn').forEach((btn) => {
          btn.addEventListener('click', () => handleRevokeSession(btn));
        });
      } catch (err) {
        wrap.innerHTML = `<div class="admin-table-empty">Failed to load sessions.</div>`;
      }
    }

    async function handleRevokeSession(btn) {
      const id = btn.getAttribute('data-id');
      btn.disabled = true;
      btn.textContent = 'Revoking…';
      try {
        await apiFetch(`/api/admin/auth/sessions/${id}`, { method: 'DELETE' });
        await loadSessions();
      } catch (err) {
        setSecurityStatus('sessions-status', `Failed to revoke session: ${err.message}`, true);
        btn.disabled = false;
        btn.textContent = 'Revoke';
      }
    }

    async function handleLogoutOtherDevices() {
      const btn = document.getElementById('logout-other-devices-btn');
      btn.disabled = true;
      setSecurityStatus('sessions-status', 'Logging out other devices…', false);
      try {
        await apiFetch('/api/admin/auth/sessions/logout-all', { method: 'POST' });
        setSecurityStatus('sessions-status', 'Other devices logged out.', false);
        await loadSessions();
      } catch (err) {
        setSecurityStatus('sessions-status', `Failed: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadSettings() {
      try {
        const data = await apiFetch('/api/admin/settings');
        document.getElementById('businessName').value = data.businessName || '';
        document.getElementById('logoUrl').value = data.logoUrl || '';
        document.getElementById('whatsappNumber').value = data.whatsappNumber || '';
        document.getElementById('contactEmail').value = data.contactEmail || '';
        renderShippingRates(data.shippingRates);
      } catch (err) {
        setStatus(`Failed to load settings: ${err.message}`, true);
        document.getElementById('shipping-rates-display').innerHTML = `<div class="admin-table-empty">Failed to load shipping rates.</div>`;
      }
    }

    async function handleSubmit(evt) {
      evt.preventDefault();
      const btn = document.getElementById('save-settings-btn');
      const payload = {
        businessName: document.getElementById('businessName').value.trim(),
        logoUrl: document.getElementById('logoUrl').value.trim(),
        whatsappNumber: document.getElementById('whatsappNumber').value.trim(),
        contactEmail: document.getElementById('contactEmail').value.trim()
      };

      btn.disabled = true;
      setStatus('Saving…', false);
      try {
        await apiFetch('/api/admin/settings', {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        setStatus('Saved.', false);
      } catch (err) {
        setStatus(`Failed to save: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function init() {
      const admin = await requireAdminAuth();
      if (!admin) return;

      document.getElementById('admin-root').innerHTML = `
        <div class="admin-shell">
          ${renderSidebar('settings', admin)}
          <div class="admin-main">
            <div class="admin-topbar">
              <h1>Settings</h1>
            </div>
            <div class="admin-content">
              <form id="settings-form" class="admin-panel" style="max-width:640px;">
                <div class="admin-panel-header">
                  <h2>Business Details</h2>
                </div>
                <div style="padding:20px;display:flex;flex-direction:column;gap:18px;">
                  <div>
                    <label class="form-label" for="businessName">Business Name</label>
                    <input class="form-input" type="text" id="businessName" name="businessName" required />
                  </div>
                  <div>
                    <label class="form-label" for="logoUrl">Logo URL</label>
                    <input class="form-input" type="text" id="logoUrl" name="logoUrl" placeholder="https://…" />
                  </div>
                  <div>
                    <label class="form-label" for="whatsappNumber">WhatsApp Number</label>
                    <input class="form-input" type="text" id="whatsappNumber" name="whatsappNumber" placeholder="8801XXXXXXXXX" />
                  </div>
                  <div>
                    <label class="form-label" for="contactEmail">Contact Email</label>
                    <input class="form-input" type="email" id="contactEmail" name="contactEmail" />
                  </div>
                  <div style="display:flex;align-items:center;gap:14px;">
                    <button type="submit" class="btn-primary" id="save-settings-btn">Save Changes</button>
                    <span id="settings-save-status" style="font-size:13px;color:var(--text-muted);"></span>
                  </div>
                </div>
              </form>

              <div class="admin-panel" style="max-width:640px;margin-top:24px;">
                <div class="admin-panel-header">
                  <h2>Shipping &amp; Duty Rates</h2>
                </div>
                <div id="shipping-rates-display">
                  <div class="admin-table-empty">Loading…</div>
                </div>
              </div>

              <div class="admin-panel" style="max-width:640px;margin-top:24px;">
                <div class="admin-panel-header">
                  <h2>Security</h2>
                </div>

                <form id="change-password-form" style="padding:20px;display:flex;flex-direction:column;gap:18px;border-bottom:1px solid var(--border-color);">
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);">Change Password</div>
                  <div>
                    <label class="form-label" for="currentPassword">Current Password</label>
                    <input class="form-input" type="password" id="currentPassword" autocomplete="current-password" required />
                  </div>
                  <div>
                    <label class="form-label" for="newPassword">New Password</label>
                    <input class="form-input" type="password" id="newPassword" autocomplete="new-password" required />
                  </div>
                  <div>
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input class="form-input" type="password" id="confirmPassword" autocomplete="new-password" required />
                  </div>
                  <div style="display:flex;align-items:center;gap:14px;">
                    <button type="submit" class="btn-primary" id="change-password-btn">Save Password</button>
                    <span id="change-password-status" style="font-size:13px;color:var(--text-muted);"></span>
                  </div>
                </form>

                <div style="padding:20px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);">Active Sessions</div>
                    <button type="button" class="btn-secondary" id="logout-other-devices-btn" style="padding:6px 12px;font-size:12px;">Log Out Other Devices</button>
                  </div>
                  <div id="sessions-list" style="border:1px solid var(--border-color);border-radius:var(--radius-sm);margin-top:10px;">
                    <div class="admin-table-empty">Loading sessions…</div>
                  </div>
                  <div style="margin-top:10px;">
                    <span id="sessions-status" style="font-size:13px;color:var(--text-muted);"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      wireLogout();
      document.getElementById('settings-form').addEventListener('submit', handleSubmit);
      document.getElementById('change-password-form').addEventListener('submit', handleChangePassword);
      document.getElementById('logout-other-devices-btn').addEventListener('click', handleLogoutOtherDevices);

      await loadSettings();
      await loadSessions();
    }

    init();
  </script>
</body>
</html>
