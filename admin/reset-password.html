<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | Marketia China Control Panel</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/admin/css/admin.css" />

<style>
  .admin-auth-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .admin-auth-brand .mark {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--mc-china-red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    flex-shrink: 0;
  }

  .admin-auth-brand .title {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--text-primary);
  }

  .admin-auth-brand .title span {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .admin-auth-field {
    margin-bottom: 18px;
  }

  .admin-auth-error {
    color: var(--mc-china-red);
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 14px;
    min-height: 18px;
  }

  .admin-auth-success {
    color: #10A34A;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.5;
  }

  .admin-auth-subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin: -14px 0 20px 0;
    line-height: 1.5;
  }

  .admin-auth-submit {
    width: 100%;
    margin-top: 6px;
  }

  .admin-auth-back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--mc-china-red);
  }
</style>
</head>
<body>

<div class="admin-auth-screen">
  <div class="admin-auth-card">
    <div class="admin-auth-brand">
      <div class="mark">MC</div>
      <div class="title">Marketia China<span>Control Panel</span></div>
    </div>

    <div id="reset-root"></div>
  </div>
</div>

<script type="module">
  const token = new URLSearchParams(window.location.search).get('token') || '';
  const root = document.getElementById('reset-root');

  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    let data = null;
    try {
      data = await res.json();
    } catch (_) {
      /* no body */
    }
    if (!res.ok) {
      throw new Error((data && data.error) || `Request failed (${res.status})`);
    }
    return data;
  }

  function renderInvalidToken() {
    root.innerHTML = `
      <h1 style="font-size:17px;font-weight:800;margin-bottom:14px;">Reset Password</h1>
      <div class="admin-auth-error" style="min-height:auto;">This password reset link is invalid or missing. Please request a new one from your administrator.</div>
      <a class="admin-auth-back-link" href="/admin/index.html">&larr; Back to Log In</a>
    `;
  }

  function renderSuccess() {
    root.innerHTML = `
      <h1 style="font-size:17px;font-weight:800;margin-bottom:14px;">Reset Password</h1>
      <div class="admin-auth-success">Your password has been updated. You can now log in with your new password.</div>
      <a class="admin-auth-back-link" href="/admin/index.html">Log In Now &rarr;</a>
    `;
  }

  function renderForm() {
    root.innerHTML = `
      <h1 style="font-size:17px;font-weight:800;margin-bottom:6px;">Reset Password</h1>
      <p class="admin-auth-subtitle">Choose a new password for your admin account.</p>

      <form id="admin-reset-form" novalidate>
        <div class="admin-auth-field">
          <label class="form-label" for="reset-new-password">New Password</label>
          <input class="form-input" type="password" id="reset-new-password" name="newPassword" autocomplete="new-password" required />
        </div>
        <div class="admin-auth-field">
          <label class="form-label" for="reset-confirm-password">Confirm New Password</label>
          <input class="form-input" type="password" id="reset-confirm-password" name="confirmPassword" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn-primary admin-auth-submit" id="reset-submit-btn">Reset Password</button>

        <div class="admin-auth-error" id="reset-error"></div>
      </form>

      <a class="admin-auth-back-link" href="/admin/index.html">&larr; Back to Log In</a>
    `;

    const form = document.getElementById('admin-reset-form');
    const errorEl = document.getElementById('reset-error');
    const submitBtn = document.getElementById('reset-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';

      const newPassword = document.getElementById('reset-new-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;

      if (newPassword.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting…';

      try {
        await apiFetch('/api/admin/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, newPassword })
        });
        renderSuccess();
      } catch (err) {
        errorEl.textContent = err.message || 'This link may have expired. Please request a new one.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  }

  if (!token) {
    renderInvalidToken();
  } else {
    renderForm();
  }
</script>

</body>
</html>
