<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products | Marketia China Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tailwind.build.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/glass.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />

  <style>
    .admin-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      display: block;
    }
    .admin-thumb-empty {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .admin-inline-banner {
      display: none;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }
    .admin-inline-banner.show { display: block; }
    .admin-inline-banner.error { background: var(--mc-china-red-light); color: var(--mc-china-red); }
    .admin-inline-banner.success { background: rgba(16, 163, 74, 0.12); color: #10A34A; }
    .admin-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .admin-toast.show { opacity: 1; transform: translateY(0); }
    .admin-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }
    .admin-toolbar .form-input {
      margin: 0;
    }
    .admin-toolbar-search {
      flex: 1;
      min-width: 200px;
    }
    .admin-toolbar-filter {
      width: 200px;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <h1>Products</h1>
      </div>
      <div class="admin-content">
        <div class="admin-panel">
          <div id="admin-banner" class="admin-inline-banner"></div>
          <div class="admin-panel-header">
            <h2>All Products</h2>
            <a href="/admin/product-form.html" id="add-product-btn" class="btn-primary">+ Add Product</a>
          </div>
          <div class="admin-toolbar">
            <input class="form-input admin-toolbar-search" id="product-search" type="text" placeholder="Search products by name..." />
            <select class="form-input admin-toolbar-filter" id="product-category-filter">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price (BDT)</th>
                  <th>MOQ</th>
                  <th>Status</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <tr><td colspan="7"><div class="admin-table-empty">Loading products…</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-toast" id="admin-toast"></div>

  <script type="module">
    import { apiFetch, requireAdminAuth, renderSidebar, wireLogout, escapeHtml } from './js/adminShell.js';

    let products = [];
    let categories = [];

    function money(n) {
      const num = Number(n);
      return Number.isFinite(num) ? num.toLocaleString('en-US') : '0';
    }

    function imgSrc(path) {
      if (!path) return '';
      if (/^https?:\/\//i.test(path) || /^data:/i.test(path) || path.startsWith('/')) return path;
      return '/' + path.replace(/^\.?\//, '');
    }

    async function loadCategories() {
      try {
        const data = await apiFetch('/api/admin/categories');
        categories = data.categories || [];
      } catch (err) {
        categories = [];
        showBanner(err.message, 'error');
      }
    }

    function populateFilterCategoryOptions() {
      const sel = document.getElementById('product-category-filter');
      const opts = categories
        .map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml((c.name && c.name.en) || c.slug)}</option>`)
        .join('');
      sel.innerHTML = '<option value="">All Categories</option>' + opts;
    }

    function getFilteredProducts() {
      const q = document.getElementById('product-search').value.trim().toLowerCase();
      const cat = document.getElementById('product-category-filter').value;
      return products.filter(p => {
        const nameEn = ((p.name && p.name.en) || '').toLowerCase();
        const matchesSearch = !q || nameEn.includes(q);
        const matchesCategory = !cat || p.category === cat;
        return matchesSearch && matchesCategory;
      });
    }

    const STATUS_BADGE_CLASS = {
      published: 'admin-badge-green',
      draft: 'admin-badge-gold',
      archived: 'admin-badge-neutral'
    };

    function renderTable() {
      const tbody = document.getElementById('products-tbody');
      const list = getFilteredProducts();
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="admin-table-empty">No products yet. Click "Add Product" to create one.</div></td></tr>';
        return;
      }
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="admin-table-empty">No products match your search/filter.</div></td></tr>';
        return;
      }
      tbody.innerHTML = list.map(p => {
        const nameEn = (p.name && p.name.en) || '';
        const img = p.image
          ? `<img class="admin-thumb" src="${escapeHtml(imgSrc(p.image))}" alt="" onerror="this.outerHTML='<div class=&quot;admin-thumb-empty&quot;>📦</div>'" />`
          : '<div class="admin-thumb-empty">📦</div>';
        const status = p.status || 'draft';
        const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);
        const badgeClass = STATUS_BADGE_CLASS[status] || 'admin-badge-neutral';
        const badge = `<span class="admin-badge ${badgeClass}">${escapeHtml(statusLabel)}</span>`;
        const actionBtn = p.isActive
          ? `<button class="admin-icon-btn delete-btn" data-id="${escapeHtml(p.id)}" title="Delete">🗑️</button>`
          : `<button class="admin-icon-btn restore-btn" data-id="${escapeHtml(p.id)}" title="Restore">♻️</button>`;
        return `
          <tr>
            <td>${img}</td>
            <td>${escapeHtml(nameEn)}</td>
            <td>${escapeHtml(p.category)}</td>
            <td>৳${money(p.priceBDT)}</td>
            <td>${escapeHtml(p.moq)}</td>
            <td>${badge}</td>
            <td>
              <div class="admin-row-actions">
                <a class="admin-icon-btn" href="/admin/product-form.html?id=${encodeURIComponent(p.id)}" title="Edit">✏️</a>
                ${actionBtn}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => handleDelete(btn.dataset.id)));
      tbody.querySelectorAll('.restore-btn').forEach(btn => btn.addEventListener('click', () => handleRestore(btn.dataset.id)));
    }

    async function loadProducts() {
      try {
        const data = await apiFetch('/api/admin/products');
        products = data.products || [];
        renderTable();
      } catch (err) {
        showBanner(err.message, 'error');
      }
    }

    async function handleDelete(id) {
      if (!confirm('Delete this product? It will be hidden from the storefront but can be restored later.')) return;
      try {
        await apiFetch(`/api/admin/products/${encodeURIComponent(id)}`, { method: 'DELETE' });
        showToast('Product deleted');
        await loadProducts();
      } catch (err) {
        showBanner(err.message, 'error');
      }
    }

    async function handleRestore(id) {
      try {
        await apiFetch(`/api/admin/products/${encodeURIComponent(id)}/restore`, { method: 'POST' });
        showToast('Product restored');
        await loadProducts();
      } catch (err) {
        showBanner(err.message, 'error');
      }
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('admin-toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    let bannerTimer = null;
    function showBanner(msg, type) {
      const el = document.getElementById('admin-banner');
      el.textContent = msg;
      el.className = `admin-inline-banner show ${type || 'error'}`;
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => el.classList.remove('show'), 5000);
    }

    (async function init() {
      const admin = await requireAdminAuth();
      if (!admin) return;
      document.getElementById('admin-shell').insertAdjacentHTML('afterbegin', renderSidebar('products', admin));
      wireLogout();
      document.getElementById('product-search').addEventListener('input', renderTable);
      document.getElementById('product-category-filter').addEventListener('change', renderTable);
      await Promise.all([loadProducts(), loadCategories()]);
      populateFilterCategoryOptions();
    })();
  </script>
</body>
</html>
